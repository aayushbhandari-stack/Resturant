
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kitchen Dashboard</title>

    <!-- Django CSRF token -->
    {% csrf_token %}

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .top-bar h2 {
            margin: 0;
        }

        .refresh-btn {
            width: auto;
            padding: 10px 18px;
            margin: 0;
            background: #333;
        }

        .orders {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(320px, 1fr)
            );
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .order-header {
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-header h2 {
            margin: 0 0 10px;
        }

        .order-header p {
            margin: 5px 0;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 5px;
            margin-top: 10px;
            background: #eee;
            font-weight: bold;
            text-transform: capitalize;
        }

        .status.pending {
            background: #fff0c2;
            color: #805500;
        }

        .status.confirmed {
            background: #dcecff;
            color: #084b9b;
        }

        .status.preparing {
            background: #ffe2c2;
            color: #914500;
        }

        .status.ready {
            background: #d5f5df;
            color: #176b32;
        }

        .food-item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .food-item:last-child {
            border-bottom: none;
        }

        .food-name {
            font-weight: bold;
            font-size: 18px;
            overflow-wrap: anywhere;
        }

        .quantity {
            font-weight: bold;
        }

        .note {
            margin-top: 6px;
            color: #666;
            font-style: italic;
            overflow-wrap: anywhere;
        }

        .order-note {
            margin-top: 15px;
            padding: 12px;
            background: #f7f7f7;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .empty {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 10px;
            grid-column: 1 / -1;
        }

        .loading {
            text-align: center;
            padding: 40px;
            grid-column: 1 / -1;
        }

        .error-box {
            background: #ffe5e5;
            color: #a00000;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 10px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .refresh-btn {
                width: 100%;
            }

            .orders {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Kitchen Dashboard</h1>
</header>

<div class="container">

    <div class="top-bar">
        <h2>Kitchen Orders</h2>

        <button
            class="refresh-btn"
            type="button"
            onclick="loadOrders()"
        >
            Refresh Orders
        </button>
    </div>

    <div id="errorBox" class="error-box"></div>

    <div id="orders" class="orders">
        <div class="loading">
            Loading orders...
        </div>
    </div>

</div>

<script>
    // ==========================================
    // API URLS
    // ==========================================

    const ORDERS_API = "/api/kitchen/orders/";

    function getStatusAPI(orderId) {
        return `/api/orders/${orderId}/status/`;
    }

    // ==========================================
    // CSRF TOKEN
    // ==========================================

    function getCookie(name) {
        let cookieValue = null;

        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");

            for (let cookie of cookies) {
                cookie = cookie.trim();

                if (cookie.startsWith(name + "=")) {
                    cookieValue = decodeURIComponent(
                        cookie.substring(name.length + 1)
                    );
                    break;
                }
            }
        }

        return cookieValue;
    }

    function getCSRFToken() {
        // First, get the token from Django's CSRF cookie.
        let token = getCookie("csrftoken");

        // If the cookie is unavailable, try Django's hidden input.
        if (!token) {
            const csrfInput = document.querySelector(
                'input[name="csrfmiddlewaretoken"]'
            );

            if (csrfInput) {
                token = csrfInput.value;
            }
        }

        return token;
    }

    // ==========================================
    // ERROR DISPLAY
    // ==========================================

    function showError(message) {
        const errorBox = document.getElementById("errorBox");

        errorBox.textContent = message;
        errorBox.style.display = "block";
    }

    function hideError() {
        const errorBox = document.getElementById("errorBox");

        errorBox.textContent = "";
        errorBox.style.display = "none";
    }

    // ==========================================
    // LOAD ORDERS
    // ==========================================

    let loadingOrders = false;

    async function loadOrders() {

        if (loadingOrders) {
            return;
        }

        loadingOrders = true;

        const container = document.getElementById("orders");

        hideError();

        container.innerHTML = `
            <div class="loading">
                Loading orders...
            </div>
        `;

        try {
            const response = await fetch(ORDERS_API, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                },
                credentials: "same-origin"
            });

            const responseText = await response.text();

            console.log(
                "Kitchen API status:",
                response.status
            );

            console.log(
                "Kitchen API response:",
                responseText
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}: ${responseText}`
                );
            }

            let data;

            try {
                data = JSON.parse(responseText);
            } catch {
                throw new Error(
                    "The kitchen API did not return valid JSON."
                );
            }

            // Support DRF pagination:
            // { "count": 10, "results": [...] }
            const orders = Array.isArray(data)
                ? data
                : data.results;

            if (!Array.isArray(orders)) {
                throw new Error(
                    "Invalid API format. Expected an order list or a results array."
                );
            }

            displayOrders(orders);

        } catch (error) {
            console.error(
                "Loading orders failed:",
                error
            );

            container.innerHTML = `
                <div class="empty">
                    <h2>Could not load orders</h2>
                    <p>${escapeHTML(error.message)}</p>
                    <p>Check your Django API URL and server logs.</p>
                </div>
            `;

        } finally {
            loadingOrders = false;
        }
    }

    // ==========================================
    // HTML ESCAPING
    // ==========================================

    function escapeHTML(value) {
        const div = document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;
    }

    // ==========================================
    // DISPLAY ORDERS
    // ==========================================

    function displayOrders(orders) {

        const container = document.getElementById("orders");

        if (!orders || orders.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    <h2>No kitchen orders</h2>
                    <p>New orders will appear here.</p>
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        orders.forEach(order => {

            let itemsHTML = "";

            const items = Array.isArray(order.items)
                ? order.items
                : [];

            items.forEach(item => {

                itemsHTML += `
                    <div class="food-item">

                        <div class="food-name">
                            ${escapeHTML(item.food_name)}
                        </div>

                        <div>
                            Quantity:
                            <span class="quantity">
                                ${escapeHTML(item.quantity)}
                            </span>
                        </div>

                        ${
                            item.special_instructions
                            ? `
                                <div class="note">
                                    Note:
                                    ${escapeHTML(item.special_instructions)}
                                </div>
                            `
                            : ""
                        }

                    </div>
                `;
            });

            const currentStatus = String(
                order.status || ""
            ).toLowerCase();

            const nextStatus = getNextStatus(currentStatus);

            const buttonText = getButtonText(currentStatus);

            const statusClass = [
                "pending",
                "confirmed",
                "preparing",
                "ready"
            ].includes(currentStatus)
                ? currentStatus
                : "";

            const orderCard = document.createElement("div");

            orderCard.className = "order-card";

            orderCard.innerHTML = `

                <div class="order-header">

                    <h2>
                        Order #${escapeHTML(order.id)}
                    </h2>

                    <p>
                        <strong>Table:</strong>
                        ${escapeHTML(order.table ?? "N/A")}
                    </p>

                    <p>
                        <strong>Customer:</strong>
                        ${escapeHTML(order.customer_name ?? "N/A")}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${escapeHTML(order.customer_phone ?? "N/A")}
                    </p>

                    <span class="status ${statusClass}">
                        ${escapeHTML(order.status)}
                    </span>

                </div>

                <div>
                    ${itemsHTML || "<p>No food items found.</p>"}
                </div>

                ${
                    order.special_instructions
                    ? `
                        <div class="order-note">
                            <strong>Order Note:</strong>
                            <p>
                                ${escapeHTML(order.special_instructions)}
                            </p>
                        </div>
                    `
                    : ""
                }

                ${
                    nextStatus
                    ? `
                        <button
                            type="button"
                            class="status-btn"
                            data-order-id="${escapeHTML(order.id)}"
                        >
                            ${buttonText}
                        </button>
                    `
                    : ""
                }

            `;

            container.appendChild(orderCard);

            // Attach event listener safely.
            const button = orderCard.querySelector(".status-btn");

            if (button) {
                button.addEventListener("click", () => {
                    updateOrderStatus(
                        order.id,
                        currentStatus,
                        button
                    );
                });
            }
        });
    }

    // ==========================================
    // GET NEXT STATUS
    // ==========================================

    function getNextStatus(currentStatus) {

        const statusMap = {
            pending: "confirmed",
            confirmed: "preparing",
            preparing: "ready"
        };

        return statusMap[currentStatus] || null;
    }

    // ==========================================
    // BUTTON TEXT
    // ==========================================

    function getButtonText(status) {

        const buttonMap = {
            pending: "Confirm Order",
            confirmed: "Start Preparing",
            preparing: "Mark as Ready"
        };

        return buttonMap[status] || "";
    }

    // ==========================================
    // UPDATE ORDER STATUS
    // ==========================================

    async function updateOrderStatus(
        orderId,
        currentStatus,
        button
    ) {

        const nextStatus = getNextStatus(currentStatus);

        if (!nextStatus) {
            return;
        }

        hideError();

        button.disabled = true;
        button.textContent = "Updating...";

        try {

            const csrftoken = getCSRFToken();

            if (!csrftoken) {
                throw new Error(
                    "CSRF token missing. Check your Django CSRF settings."
                );
            }

            console.log("Order ID:", orderId);
            console.log("Current status:", currentStatus);
            console.log("Changing to:", nextStatus);

            const response = await fetch(
                getStatusAPI(orderId),
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "X-CSRFToken": csrftoken
                    },

                    credentials: "same-origin",

                    body: JSON.stringify({
                        status: nextStatus
                    })
                }
            );

            const responseText = await response.text();

            console.log(
                "Status update HTTP:",
                response.status
            );

            console.log(
                "Status update response:",
                responseText
            );

            let data = {};

            try {
                data = responseText
                    ? JSON.parse(responseText)
                    : {};
            } catch {
                data = {};
            }

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    data.detail ||
                    responseText ||
                    `HTTP ${response.status}`
                );
            }

            console.log("Order updated:", data);

            // Reload orders after successful database update.
            await loadOrders();

        } catch (error) {

            console.error(
                "Status update failed:",
                error
            );

            showError(
                "Failed to update order status: " + error.message
            );

            button.disabled = false;
            button.textContent = getButtonText(currentStatus);
        }
    }

    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadOrders();

    // ==========================================
    // AUTO REFRESH EVERY 5 SECONDS
    // ==========================================

    setInterval(loadOrders, 5000);

</script>

</body>
</html>
