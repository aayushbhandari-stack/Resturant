

<div class="checkout-container">

    <!-- ============================= -->
    <!-- YOUR ORDER -->
    <!-- ============================= -->

    <div class="checkout-card">

        <h1>Your Order</h1>

        {% for item in cart_items %}

        <div class="order-item">

            <div class="item-header">

                <div>
                    <h3>{{ item.food.name }}</h3>

                    <p>
                        Quantity: {{ item.quantity }}
                    </p>

                    <p class="price">
                        Rs. {{ item.subtotal }}
                    </p>
                </div>

            </div>

            <!-- SPECIAL INSTRUCTION FOR THIS FOOD -->
            <div class="item-instruction">

                <label for="instruction_{{ item.id }}">
                    Special instruction for {{ item.food.name }}
                </label>

                <textarea
                    id="instruction_{{ item.id }}"
                    name="special_instructions_{{ item.id }}"
                    rows="3"
                    placeholder="Example: Less spicy, no onions, extra cheese..."
                >{{ item.special_instructions|default:"" }}</textarea>

            </div>

        </div>

        {% endfor %}

        <div class="total-row">

            <strong>Total</strong>

            <strong>
                Rs. {{ total }}
            </strong>

        </div>

    </div>


    <!-- ============================= -->
    <!-- CUSTOMER INFORMATION -->
    <!-- ============================= -->

    <div class="checkout-card">

        <h2>Customer Information</h2>

        <form method="POST" action="{% url 'place_order' %}">

            {% csrf_token %}

            <div class="form-group">

                <label for="customer_name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="customer_name"
                    name="customer_name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="customer_phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="customer_phone"
                    name="customer_phone"
                    placeholder="Enter your phone number"
                >

            </div>


            {% if table %}

            <div class="table-info">

                <strong>Table:</strong>
                {{ table.table_number }}

            </div>

            {% endif %}


            <!--
                The special instruction textareas above
                must be INSIDE this form.
            -->

            <button
                type="submit"
                class="place-order-btn"
            >
                Place Order
            </button>

        </form>

    </div>

</div>


<style>

.checkout-container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.checkout-card {
    background: white;
    border-radius: 18px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

.checkout-card h1,
.checkout-card h2 {
    margin-bottom: 25px;
    color: #111;
}

.order-item {
    border-bottom: 1px solid #eee;
    padding: 20px 0;
}

.item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.item-header h3 {
    margin: 0 0 8px;
    font-size: 20px;
}

.item-header p {
    margin: 5px 0;
    color: #666;
}

.item-header .price {
    color: #111;
    font-weight: bold;
}

.item-instruction {
    margin-top: 18px;
}

.item-instruction label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
}

.item-instruction textarea {
    width: 100%;
    min-height: 80px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
    font-size: 15px;
    box-sizing: border-box;
}

.total-row {
    display: flex;
    justify-content: space-between;
    font-size: 22px;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 2px solid #eee;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

.table-info {
    margin: 20px 0;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 8px;
}

.place-order-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.place-order-btn:hover {
    background: #333;
}

</style>
