<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Category</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f5f9;
            color: #172033;
        }

        .container {
            max-width: 650px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2864e8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .save {
            background: #2864e8;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 11px 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .cancel {
            background: #e5e7eb;
            color: #172033;
            text-decoration: none;
            border-radius: 8px;
            padding: 11px 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Edit Category</h1>

        <p class="subtitle">
            Update your food category.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="name">
                Category Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ category.category_name }}"
                required
            >

            <div class="buttons">

                <button type="submit"
                        class="save">
                    Update Category
                </button>

                <a href="{% url 'manager_category_list' %}"
                   class="cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
