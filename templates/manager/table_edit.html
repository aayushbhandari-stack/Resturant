{% extends "manager/base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Edit Table</h2>

        <a href="{% url 'manager_table_list' %}" class="btn btn-secondary">
            ← Back to Tables
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <!-- Table Number -->
                <div class="mb-3">
                    <label for="table_number" class="form-label">
                        Table Number
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="table_number"
                        name="table_number"
                        value="{{ table.table_number }}"
                        min="1"
                        required
                    >
                </div>

                <!-- Capacity -->
                <div class="mb-3">
                    <label for="capacity" class="form-label">
                        Capacity
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="capacity"
                        name="capacity"
                        value="{{ table.capacity }}"
                        min="1"
                        required
                    >
                </div>

                <!-- Status -->
                <div class="mb-3">
                    <label for="status" class="form-label">
                        Status
                    </label>

                    <select
                        class="form-select"
                        id="status"
                        name="status"
                        required
                    >
                        <option value="available"
                            {% if table.status == "available" %}selected{% endif %}>
                            Available
                        </option>

                        <option value="occupied"
                            {% if table.status == "occupied" %}selected{% endif %}>
                            Occupied
                        </option>

                        <option value="reserved"
                            {% if table.status == "reserved" %}selected{% endif %}>
                            Reserved
                        </option>

                        <option value="maintenance"
                            {% if table.status == "maintenance" %}selected{% endif %}>
                            Maintenance
                        </option>
                    </select>
                </div>

                <!-- Submit -->
                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Table
                    </button>

                    <a
                        href="{% url 'manager_table_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
