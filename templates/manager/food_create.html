<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Food</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: #777;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;
            border: 1px solid #ffcaca;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .required {
            color: #e53935;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        select.form-control {
            cursor: pointer;
        }

        input[type="file"].form-control {
            padding: 9px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-wrapper input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-wrapper label {
            margin: 0;
            cursor: pointer;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .page {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<div class="page">

    <div class="card">

        <!-- BACK TO FOOD LIST -->

        <a
            href="{% url 'manager_food_list' %}"
            class="back-link"
        >
            ← Back to Food List
        </a>


        <!-- HEADER -->

        <div class="header">

            <h1>
                Add Food
            </h1>

            <p>
                Add a new food item to your restaurant menu.
            </p>

        </div>


        <!-- ERROR -->

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <!-- FORM -->

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- FOOD NAME -->

            <div class="form-group">

                <label for="name">
                    Food Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter food name"
                    required
                >

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label for="price">
                    Price
                    <span class="required">*</span>
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    class="form-control"
                    placeholder="Enter price"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category
                    <span class="required">*</span>
                </label>

                <select
                    id="category"
                    name="category"
                    class="form-control"
                    required
                >

                    <option value="">
                        -- Select Category --
                    </option>

                    {% for category in categories %}

                        <option value="{{ category.id }}">
                            {{ category.category_name }}
                        </option>

                    {% empty %}

                        <option value="">
                            No categories available
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- IMAGE -->

            <div class="form-group">

                <label for="image">
                    Food Image
                </label>

                <input
                    type="file"
                    id="image"
                    name="image"
                    class="form-control"
                    accept="image/*"
                >

            </div>


            <!-- AVAILABLE -->

            <div class="form-group">

                <div class="checkbox-wrapper">

                    <input
                        type="checkbox"
                        id="is_available"
                        name="is_available"
                        checked
                    >

                    <label for="is_available">
                        Food is available
                    </label>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Add Food
                </button>


                <a
                    href="{% url 'manager_food_list' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
